name: Hot News Crawler

on:
  schedule:
    # 我们使用的是 github 官方提供的资源来进行的推送，而每个账号的资源是限额的，为了不被官方判定为滥用而面临封号的风险，不建议比半小时更低
    - cron: "0 * * * *" # 每小时整点运行一次(实际有偏差) 或者 "*/30 * * * *" (每半小时执行一次) 或者 "*/30 0-14 * * *"(每天早上 8 点到晚上 10 点期间，每半小时运行一次)
  workflow_dispatch:

# 添加权限设置
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 截图只用 Chromium。Playwright 1.61 起才带 Ubuntu 26.04 的系统库名单，
          # ubuntu-latest 已切到 26.04，旧版会去装已经改名的 libicu74 等包然后失败。
          # 装字体时 GitHub 的机器偶尔暂时解析不了 security.ubuntu.com，失败就再试。
          installed=0
          for i in 1 2 3; do
            if playwright install --with-deps chromium; then
              installed=1
              break
            fi
            echo "安装浏览器失败（第 ${i}/3 次），30 秒后重试..."
            sleep 30
          done
          if [ "$installed" != 1 ]; then
            echo "安装浏览器重试 3 次后仍失败"
            exit 1
          fi

      - name: Verify required files
        run: |
          echo "🔍 检查必需的配置文件..."

          if [ ! -f config/config.yaml ]; then
            echo "❌ 错误: config/config.yaml 文件不存在"
            echo "请参考项目文档创建配置文件"
            exit 1
          fi

          if [ ! -f config/frequency_words.txt ]; then
            echo "❌ 错误: config/frequency_words.txt 文件不存在"
            echo "请参考项目文档创建频率词配置文件"
            exit 1
          fi

          echo "✅ 配置文件检查通过"

      - name: Run crawler
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          GITHUB_ACTIONS: true
        run: python main.py

      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto update by GitHub Actions at $(TZ=Asia/Shanghai date)"
            BRANCH=$(git rev-parse --abbrev-ref HEAD)

            # 先对齐远程，减少非快进冲突
            git pull --rebase origin "$BRANCH" || {
              echo "拉取远程更改失败，尝试普通合并..."
              git pull origin "$BRANCH" || {
                echo "警告：无法拉取远程更改，将直接尝试推送"
              }
            }

            # 推送失败时重试（应对 GitHub 临时 commit_refs 错误）
            MAX_RETRIES=3
            for i in $(seq 1 $MAX_RETRIES); do
              if git push origin "$BRANCH"; then
                echo "✅ 推送成功（第 ${i} 次尝试）"
                exit 0
              fi
              echo "⚠️ 推送失败（第 ${i}/${MAX_RETRIES} 次），30 秒后重试..."
              sleep 30
              # 重试前再尝试 rebase，避免期间远程又有新提交
              git pull --rebase origin "$BRANCH" || true
            done

            echo "❌ 推送在 ${MAX_RETRIES} 次重试后仍失败，下次定时任务会再试"
            exit 1
          fi
